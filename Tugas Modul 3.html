<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Registrasi Premium - Modul 3 Bootstrap</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#060b16;
  --navy:#0d1b32;
  --gold:#d4af37;
  --gold-light:#f3e2a9;
  --emerald:#0f6b55;
  --text-soft:rgba(255,255,255,.78);
  --text-mute:rgba(255,255,255,.45);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Poppins',Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(212,175,55,.10), transparent 55%),
    radial-gradient(circle at 80% 80%, rgba(15,107,85,.18), transparent 55%),
    linear-gradient(160deg,var(--navy) 0%,var(--bg-deep) 100%);
  color:var(--text-soft);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}

.shape-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.shape-enter{
  position:absolute;
  opacity:0;
  animation:shapeEnter 1.1s cubic-bezier(.16,.84,.44,1) both;
}
@keyframes shapeEnter{
  from{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3) rotate(var(--rot));}
  to{opacity:1;transform:translate(0,0) scale(1) rotate(0deg);}
}
.shape-float{animation:shapeFloat var(--fd,8s) ease-in-out infinite;animation-delay:inherit;}
@keyframes shapeFloat{
  0%,100%{transform:translate(0,0) rotate(0deg);}
  50%{transform:translate(var(--fx,14px),var(--fy,-18px)) rotate(var(--frot,6deg));}
}
.shape-visual{width:100%;height:100%;}
.s-circle{border-radius:50%;}
.s-ring{border-radius:50%;background:transparent !important;border:1.5px solid;}
.s-diamond{transform:rotate(45deg);border-radius:8px;}
.s-triangle{width:0;height:0;background:transparent !important;}
.s-blur{filter:blur(46px);}

.lux-wrapper{
  position:relative;z-index:1;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:60px 20px;
}
.lux-card{
  width:100%;max-width:440px;
  background:rgba(13,24,45,.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(212,175,55,.2);
  border-radius:22px;
  padding:52px 46px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.65);
  opacity:0;
  transform:translateY(26px) scale(.96);
  animation:cardIn .8s cubic-bezier(.16,.84,.44,1) .5s forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}
.shimmer-text{
  font-family:'Cormorant Garamond',serif;
  font-weight:700;
  font-size:2.1em;
  margin:0 0 6px;
  background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold),#fff6d8,var(--gold));
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shimmer 6s linear infinite;
}
@keyframes shimmer{0%{background-position:0% 50%;}100%{background-position:300% 50%;}}
.lux-sub{color:var(--text-mute);margin-bottom:32px;font-size:.92em;}

.form-group.floating{
  position:relative;margin-bottom:28px;
  opacity:0;transform:translateY(16px);
  animation:fieldIn .55s ease forwards;
}
@keyframes fieldIn{to{opacity:1;transform:translateY(0);}}
.field-icon{
  position:absolute;left:0;top:13px;width:18px;height:18px;
  stroke:var(--text-mute);transition:stroke .25s ease;pointer-events:none;
}
.lux-input{
  background:transparent !important;
  border:none;border-bottom:1.5px solid rgba(255,255,255,.22);
  border-radius:0 !important;color:#fff !important;
  padding:10px 34px 10px 30px;box-shadow:none !important;font-size:1em;
}
.lux-input:focus{border-bottom-color:var(--gold);box-shadow:0 1px 0 var(--gold) !important;}
.form-group.floating label{
  position:absolute;left:30px;top:12px;color:var(--text-mute);font-size:.95em;
  transition:all .22s ease;pointer-events:none;margin:0;font-weight:400;
}
.lux-input:focus ~ .field-icon,.lux-input:not(:placeholder-shown) ~ .field-icon{stroke:var(--gold);}
.lux-input:focus ~ label,.lux-input:not(:placeholder-shown) ~ label{
  top:-15px;left:30px;font-size:.72em;color:var(--gold);letter-spacing:.02em;
}
select.lux-input{padding-left:30px;appearance:none;-webkit-appearance:none;}
select.lux-input option{color:#111;}
.select-arrow{position:absolute;right:2px;top:14px;width:12px;height:12px;stroke:var(--text-mute);pointer-events:none;}
.toggle-pass{position:absolute;right:0;top:9px;background:none;border:none;color:var(--text-mute);cursor:pointer;padding:4px;}
.toggle-pass svg{width:18px;height:18px;stroke:currentColor;}
.toggle-pass:hover{color:var(--gold);}

.lux-checkbox{
  display:flex;align-items:flex-start;gap:10px;margin-bottom:30px;
  opacity:0;transform:translateY(16px);animation:fieldIn .55s ease forwards;
  font-size:.86em;color:var(--text-mute);
}
.lux-checkbox input{position:absolute;opacity:0;width:0;height:0;}
.custom-check{
  width:18px;height:18px;border:1.5px solid rgba(255,255,255,.35);border-radius:5px;
  flex:none;position:relative;margin-top:1px;transition:border-color .2s ease,background .2s ease;
}
.custom-check::after{
  content:"";position:absolute;left:5px;top:1px;width:5px;height:9px;
  border:solid var(--bg-deep);border-width:0 2px 2px 0;
  transform:rotate(45deg) scale(0);transition:transform .18s ease;
}
.lux-checkbox input:checked ~ .custom-check{background:var(--gold);border-color:var(--gold);}
.lux-checkbox input:checked ~ .custom-check::after{transform:rotate(45deg) scale(1);}
.lux-checkbox label{display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin:0;}

.lux-btn{
  position:relative;overflow:hidden;width:100%;border:none;border-radius:10px;
  padding:15px 0;font-weight:600;font-size:1em;letter-spacing:.02em;color:var(--bg-deep);
  background:linear-gradient(120deg,var(--gold-light),var(--gold),var(--gold-light));
  background-size:200% auto;cursor:pointer;
  transition:background-position .5s ease,transform .25s ease,box-shadow .25s ease;
  opacity:0;transform:translateY(16px);animation:fieldIn .55s ease forwards;
  box-shadow:0 14px 30px -12px rgba(212,175,55,.55);
}
.lux-btn:hover{background-position:100% center;transform:translateY(-3px);box-shadow:0 18px 34px -10px rgba(212,175,55,.7);}
.lux-btn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rippleAnim .6s ease-out;pointer-events:none;}
@keyframes rippleAnim{to{transform:scale(5);opacity:0;}}
.lux-btn .btn-loader{display:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(6,11,22,.35);border-top-color:var(--bg-deep);animation:spin .7s linear infinite;margin:0 auto;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.lux-btn.is-loading .btn-text{display:none;}
.lux-btn.is-loading .btn-loader{display:block;}

#regForm{transition:opacity .35s ease,transform .35s ease;}
#regForm.fade-out{opacity:0;transform:translateY(-12px);}
.lux-success{display:none;text-align:center;padding:20px 0 4px;opacity:0;transform:scale(.9);transition:opacity .5s ease,transform .5s ease;}
.lux-success.show{display:block;opacity:1;transform:scale(1);}
.lux-success svg{width:70px;height:70px;margin-bottom:18px;}
.check-circle{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:151;stroke-dashoffset:151;animation:drawCircle .6s ease forwards;}
.check-mark{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36;animation:drawCheck .4s .5s ease forwards;}
@keyframes drawCircle{to{stroke-dashoffset:0;}}
@keyframes drawCheck{to{stroke-dashoffset:0;}}
.lux-success h4{font-family:'Cormorant Garamond',serif;color:#fff;font-size:1.5em;margin-bottom:6px;}
.lux-success p{color:var(--text-mute);margin:0;}

.lux-footer{position:relative;z-index:1;text-align:center;padding:0 0 30px;color:var(--text-mute);font-size:.85em;}
.lux-footer strong{color:var(--gold-light);}

@media(max-width:480px){.lux-card{padding:42px 28px;}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s !important;transition-duration:.001s !important;}}
</style>
</head>
<body>

<div class="shape-field">
  <div class="shape-enter" style="top:12%;left:9%;width:70px;height:70px;--tx:-160px;--ty:-110px;--rot:-40deg;animation-delay:0s;">
    <div class="shape-float" style="--fd:7s;--fx:14px;--fy:-18px;--frot:8deg;">
      <div class="shape-visual s-circle" style="background:var(--gold);opacity:.55;"></div>
    </div>
  </div>
  <div class="shape-enter" style="bottom:14%;right:10%;width:96px;height:96px;--tx:190px;--ty:130px;--rot:50deg;animation-delay:.12s;">
    <div class="shape-float" style="--fd:9s;--fx:-16px;--fy:16px;--frot:-6deg;">
      <div class="shape-visual s-circle" style="background:var(--emerald);opacity:.5;"></div>
    </div>
  </div>
  <div class="shape-enter" style="top:18%;right:14%;width:120px;height:120px;--tx:190px;--ty:-90px;--rot:30deg;animation-delay:.22s;">
    <div class="shape-float" style="--fd:11s;--fx:10px;--fy:12px;--frot:10deg;">
      <div class="shape-visual s-ring" style="border-color:var(--gold);opacity:.4;"></div>
    </div>
  </div>
  <div class="shape-enter" style="bottom:10%;left:12%;width:54px;height:54px;--tx:-130px;--ty:110px;--rot:-60deg;animation-delay:.3s;">
    <div class="shape-float" style="--fd:8s;--fx:12px;--fy:-10px;--frot:-10deg;">
      <div class="shape-visual s-diamond" style="background:var(--gold);opacity:.35;"></div>
    </div>
  </div>
  <div class="shape-enter" style="top:42%;left:5%;width:16px;height:16px;--tx:-80px;--ty:60px;--rot:0deg;animation-delay:.4s;">
    <div class="shape-float" style="--fd:6s;--fx:8px;--fy:10px;">
      <div class="shape-visual s-circle" style="background:var(--gold-light);opacity:.7;"></div>
    </div>
  </div>
  <div class="shape-enter" style="bottom:36%;right:6%;width:12px;height:12px;--tx:90px;--ty:-60px;--rot:0deg;animation-delay:.48s;">
    <div class="shape-float" style="--fd:7.5s;--fx:-6px;--fy:-8px;">
      <div class="shape-visual s-circle" style="background:var(--emerald);opacity:.7;"></div>
    </div>
  </div>
  <div class="shape-enter" style="top:8%;right:32%;width:46px;height:40px;--tx:120px;--ty:-130px;--rot:70deg;animation-delay:.18s;">
    <div class="shape-float" style="--fd:9s;--fx:10px;--fy:14px;--frot:12deg;">
      <div class="shape-visual s-triangle" style="border-left:23px solid transparent;border-right:23px solid transparent;border-bottom:40px solid var(--gold);opacity:.3;"></div>
    </div>
  </div>
  <div class="shape-enter" style="top:50%;left:50%;width:280px;height:280px;margin:-140px 0 0 -140px;--tx:0px;--ty:-180px;--rot:0deg;animation-delay:.05s;">
    <div class="shape-visual s-circle s-blur" style="background:var(--emerald);opacity:.22;"></div>
  </div>
</div>

<div class="lux-wrapper">
  <div class="lux-card" id="luxCard">
    <h2 class="shimmer-text">Form Registrasi</h2>
    <p class="lux-sub">Lengkapi data di bawah untuk mendaftar.</p>

    <form id="regForm">
      <div class="form-group floating" style="animation-delay:.7s;">
        <input type="text" class="form-control lux-input" id="nama" placeholder=" " required>
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21a8 8 0 10-16 0"/><circle cx="12" cy="7" r="4"/></svg>
        <label for="nama">Nama Lengkap</label>
      </div>

      <div class="form-group floating" style="animation-delay:.82s;">
        <input type="email" class="form-control lux-input" id="email" placeholder=" " required>
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        <label for="email">Email</label>
      </div>

      <div class="form-group floating" style="animation-delay:.94s;">
        <input type="password" class="form-control lux-input" id="password" placeholder=" " required>
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>
        <label for="password">Password</label>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="form-group floating" style="animation-delay:1.06s;">
        <select class="form-control lux-input" id="jk" required>
          <option value="" disabled selected></option>
          <option>Pria</option>
          <option>Wanita</option>
        </select>
        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        <label for="jk">Jenis Kelamin</label>
      </div>

      <div class="lux-checkbox" style="animation-delay:1.18s;">
        <label>
          <input type="checkbox" id="agree" required>
          <span class="custom-check"></span>
          Saya setuju dengan Syarat &amp; Ketentuan yang berlaku
        </label>
      </div>

      <button type="submit" class="lux-btn" id="submitBtn" style="animation-delay:1.3s;">
        <span class="btn-text">Daftar Sekarang</span>
        <span class="btn-loader"></span>
      </button>
    </form>

    <div class="lux-success" id="successBox">
      <svg viewBox="0 0 52 52">
        <circle class="check-circle" cx="26" cy="26" r="24"/>
        <path class="check-mark" d="M14 27l7 7 16-16"/>
      </svg>
      <h4>Registrasi Berhasil</h4>
      <p>Akun kamu sudah siap digunakan.</p>
    </div>
  </div>
</div>

<footer class="lux-footer">
  <strong>Heavenly E Kawatu</strong> &middot; NIM 240211060018
</footer>

<script>
var togglePass = document.getElementById('togglePass');
var passwordInput = document.getElementById('password');
togglePass.addEventListener('click', function(){
  var isPass = passwordInput.type === 'password';
  passwordInput.type = isPass ? 'text' : 'password';
});

var submitBtn = document.getElementById('submitBtn');
submitBtn.addEventListener('click', function(e){
  var rect = submitBtn.getBoundingClientRect();
  var ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.left = (e.clientX - rect.left) + 'px';
  ripple.style.top = (e.clientY - rect.top) + 'px';
  submitBtn.appendChild(ripple);
  setTimeout(function(){ ripple.remove(); }, 600);
});

var regForm = document.getElementById('regForm');
var successBox = document.getElementById('successBox');
regForm.addEventListener('submit', function(e){
  e.preventDefault();
  if(!regForm.checkValidity()){ regForm.reportValidity(); return; }
  submitBtn.classList.add('is-loading');
  setTimeout(function(){
    regForm.classList.add('fade-out');
    setTimeout(function(){
      regForm.style.display = 'none';
      successBox.classList.add('show');
    }, 350);
  }, 1200);
});
</script>

</body>
</html>
